# Modern runtime; local forks are installed as part of ligtools.
name: ligtools
channels:
  - conda-forge
dependencies:
  - python=3.13
  - psi4>=1.11,<1.12
  - ambertools>=26
  - pydantic>=2.11,<3
  - qcelemental>=0.50,<0.70
  - rdkit>=2024.03
  - mdanalysis>=2.9
  - parmed>=4.3
  - ipython>=8.0
  - ipykernel>=6
  - openbabel
  - pip
  - pip:
      - .
