[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ligtools"
version = "0.2.0"
description = "Ligand preparation for GROMACS/AMBER: SMILES to GAFF2 topologies with RESP2 charges, plus coordinate alignment onto a reference structure"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY.md", "src/ligtools/psiresp/LICENSE", "src/ligtools/acpype/LICENSE"]
authors = [{ name = "Anton Vetrov" }]
keywords = [
    "molecular-dynamics",
    "gromacs",
    "amber",
    "gaff2",
    "resp",
    "psi4",
    "acpype",
    "force-field",
    "ligand-parameterization",
    "structure-alignment",
    "shape-alignment",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# Pure-Python, pip-installable requirements only.
# Psi4 and AmberTools (antechamber) are NOT on PyPI and must come from conda-forge;
# see README.md ("Installation").
dependencies = [
    "numpy>=1.25",
    "pydantic>=2.11,<3",
    "qcelemental>=0.50,<0.70",
    "scipy>=1.11",
    "tqdm>=4.60",
    "requests>=2.28",
    "msgpack>=1.0",
    "typing-extensions>=4.12",
    "ParmEd>=4.3",
    "MDAnalysis>=2.9",
    "rdkit>=2024.03",
    "ipython>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/Vetrov-Anton/ligtools"
Repository = "https://github.com/Vetrov-Anton/ligtools"
Issues = "https://github.com/Vetrov-Anton/ligtools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.setuptools.package-data]
"ligtools.psiresp" = ["LICENSE"]
"ligtools.acpype" = ["LICENSE"]
